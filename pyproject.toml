[project]
name = "pat-helper"
version = "0.1.0"
description = "Personal-scale, multi-model, lens-based paper review tool for AI-Policy / econ writing (PAT-inspired)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50",
    "openai>=1.60",
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
pat-helper = "pat_helper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pat_helper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
